name: Build Windows installer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Download and verify native tool inputs
        id: native
        shell: pwsh
        run: ./scripts/prepare-signing-tools.ps1
      - name: Install pinned Python environment
        shell: pwsh
        run: |
          python -m venv .venv-build314
          ./.venv-build314/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r packaging/windows-py314.lock
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Python installation failed' }
          ./.venv-build314/Scripts/python.exe -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { throw 'Filewheel installation failed' }
          ./.venv-build314/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed' }
      - name: Build installer from checked-out source
        shell: pwsh
        env:
          LIBREOFFICE: ${{ steps.native.outputs.libreoffice }}
          PANDOC: ${{ steps.native.outputs.pandoc }}
          FFMPEG: ${{ steps.native.outputs.ffmpeg }}
        run: |
          ./.venv-build314/Scripts/python.exe packaging/build_installer.py --libreoffice "$env:LIBREOFFICE" --pandoc "$env:PANDOC" --ffmpeg "$env:FFMPEG"
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Check frozen application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:FILEWHEEL_LOG_DIR = Join-Path $env:RUNNER_TEMP 'FilewheelLogs'
          $exe = (Resolve-Path 'build/installer-payload/Filewheel/Filewheel.exe').Path
          $testProcess = Start-Process -FilePath $exe -ArgumentList '--self-test --ui-backend quick' -WorkingDirectory (Split-Path $exe) -PassThru -WindowStyle Hidden
          if (-not $testProcess.WaitForExit(180000)) {
            Stop-Process -Id $testProcess.Id -Force
            throw 'Frozen self-test timed out after three minutes'
          }
          if ($testProcess.ExitCode -ne 0) {
            $report = Join-Path $env:FILEWHEEL_LOG_DIR 'self-test.json'
            $debugLog = Join-Path $env:FILEWHEEL_LOG_DIR 'conversion-debug.log'
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            if (Test-Path -LiteralPath $debugLog) { Get-Content -LiteralPath $debugLog -Tail 100 }
            throw 'Frozen self-test failed'
          }
          $signature = Get-AuthenticodeSignature releases/FilewheelSetup.exe
          if ($signature.Status -ne 'NotSigned') { throw 'Unsigned build job produced an unexpected signature' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: Filewheel-build-diagnostics-${{ github.sha }}
          path: |
            build/installer-payload-build.log
            build/installer-compile.log
            ${{ runner.temp }}/FilewheelLogs/
          if-no-files-found: warn
          retention-days: 7
      - name: Attest installer build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: releases/FilewheelSetup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Filewheel-unsigned-${{ github.sha }}
          path: |
            releases/FilewheelSetup.exe
            releases/INSTALLER-BUILD-INFO.json
            releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
