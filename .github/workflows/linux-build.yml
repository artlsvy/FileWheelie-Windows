name: Build Linux AppImage
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free unused hosted-runner SDK space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build baseline payload, frozen smoke, AppImage and DEB
        run: ./scripts/build-linux.sh --output build/linux-release --artifact-name Filewheel-Linux-x86_64.AppImage
      - name: Test AppImage without FUSE
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          FILEWHEEL_LOG_DIR: /tmp/filewheel-appimage-smoke
        run: build/linux-release/*.AppImage --appimage-extract-and-run --self-test --ui-backend quick
      - name: Check Debian 12 without Python or system converter tools
        run: |
          docker build -f packaging/linux/RuntimeSmoke.Dockerfile -t filewheel-runtime-check .
          mkdir -p build/debian-smoke
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD/build/linux-release/AppDir:/opt/app:ro" \
            -v "$PWD/build/debian-smoke:/evidence" -e FILEWHEEL_LOG_DIR=/evidence \
            filewheel-runtime-check /opt/app/AppRun --self-test --ui-backend quick
          python3 packaging/linux/verify_smoke.py build/debian-smoke/self-test.json
      - name: Attest installer build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/linux-release/*.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: filewheel-linux-x86_64
          path: |
            build/linux-release/*.AppImage
            build/linux-release/*.deb
            build/linux-release/BUILD-INFO.json
            build/linux-release/elf-requirements.json
            build/linux-release/frozen-smoke/
            build/linux-release/appimage-smoke/
            build/debian-smoke/
            /tmp/filewheel-appimage-smoke/
          retention-days: 14
