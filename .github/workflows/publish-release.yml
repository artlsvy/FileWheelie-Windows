name: Release Windows and Linux
on:
  push:
    tags: ['v0.3.1', 'build-v0.3.1-*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/linux-build.yml
    with:
      source_ref: v0.3.1
  windows:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-build.yml
    with:
      source_ref: v0.3.1
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: filewheel-linux-x86_64
          path: artifacts/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Filewheel-unsigned-${{ github.sha }}
          path: artifacts/windows
      - name: Assemble release and checksums
        shell: bash
        run: python3 scripts/assemble_release.py
      - name: Publish only after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.1
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/* --repo "$REPO" --verify-tag \
            --title 'Filewheel 0.3.1 — Windows and Linux' --notes-file RELEASE_NOTES_0.3.1.md
