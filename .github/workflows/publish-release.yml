name: Release Windows and Linux
on:
  push:
    tags: ['v0.3.1']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/linux-build.yml
  windows:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-build.yml
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: filewheel-linux-x86_64
          path: artifacts/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Filewheel-unsigned-${{ github.sha }}
          path: artifacts/windows
      - name: Assemble release and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp artifacts/linux/Filewheel-Linux-x86_64.AppImage release/
          cp artifacts/linux/BUILD-INFO.json release/LINUX-BUILD-INFO.json
          cp artifacts/windows/FilewheelSetup.exe release/
          cp artifacts/windows/INSTALLER-BUILD-INFO.json release/WINDOWS-BUILD-INFO.json
          cd release
          sha256sum Filewheel-Linux-x86_64.AppImage FilewheelSetup.exe > SHA256SUMS.txt
      - name: Publish only after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/* --repo "$REPO" --verify-tag \
            --title 'Filewheel 0.3.1 — Windows and Linux' --notes-file RELEASE_NOTES_0.3.1.md
