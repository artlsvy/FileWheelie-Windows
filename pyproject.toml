[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filewheel"
version = "0.2.7"
description = "Private local Windows radial file converter"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
desktop = [
    "PySide6-Essentials==6.12.0", "Pillow==13.0.0", "PyMuPDF==1.28.2",
    "pdf2docx==0.5.13", "markitdown[docx,pdf,pptx,xlsx]==0.1.9", "defusedxml==0.7.1",
    "pillow-heif==1.8.1", "comtypes==1.4.17; sys_platform == 'win32'",
]
ui = ["PySide6-Essentials>=6.12,<7"]
images = ["Pillow>=12,<14", "PyMuPDF>=1.26,<2"]
heif = ["pillow-heif>=1.0,<2"]
pdf = ["PyMuPDF>=1.26,<2", "pdf2docx>=0.5.13,<0.6"]
markdown = ["markitdown[docx,pdf,pptx,xlsx]>=0.1.9,<0.2", "PyMuPDF>=1.26,<2", "defusedxml==0.7.1"]
office = ["PyMuPDF>=1.26,<2"]
windows = ["comtypes>=1.4; sys_platform == 'win32'"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"filewheel.platforms.windows" = ["*.ps1"]
"filewheel.ui" = ["qml/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
markers = ["windows_integration: requires an interactive Windows 11 desktop"]

[tool.ruff]
target-version = "py314"
line-length = 100
