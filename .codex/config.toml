# Project-scoped Codex configuration; keep secrets in ~/.codex/config.toml or environment.
# If unavailable in your Codex client, choose an available model with /model.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
